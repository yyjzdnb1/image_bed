const AREAS = ['全部', '大朗', '寮步', '大岭山', '松山湖', '东坑'];
let currentArea = '全部';

/* ---------- 工具 ---------- */
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pct(v) { return (v === null || v === undefined) ? '-' : (v * 100).toFixed(2) + '%'; }
function fmtNum(v) { return (v === null || v === undefined) ? '-' : v; }

/* ---------- 取指标（按营服） ---------- */
function getMetric(area) {
  const m = DATA.summary || {};
  const odn = (m['ODN故障率'] && m['ODN故障率']['今日']) || {};
  const pr = (m['接入网故障压降'] && m['接入网故障压降']['今日']) || {};
  const du = (m['光缆故障工单平均历时'] && m['光缆故障工单平均历时']['今日']) || {};
  const key = (area === '全部') ? '合计' : area;
  return {
    odn: odn[key] || {},
    pr: pr[key] || {},
    du: du[key] || {},
  };
}

/* ---------- KPI 卡片 ---------- */
function renderKpis() {
  const m = getMetric(currentArea);
  const th = DATA.thresholds;
  const items = [
    { label: 'ODN 故障率', value: pct(m.odn['故障率']), danger: m.odn['故障率'] > th.odn, delta: '阈值 0.94%' },
    { label: '重复故障率', value: pct(m.odn['重复故障率']), danger: m.odn['重复故障率'] > th.repeat, delta: '阈值 0.14%' },
    { label: '平均历时', value: m.du['平均历时_小时'] !== undefined ? m.du['平均历时_小时'].toFixed(2) + ' h' : '-', danger: m.du['平均历时_小时'] > th.duration, delta: '阈值 6 h' },
    { label: '考核单量', value: fmtNum(m.pr['考核单量']), danger: false, delta: '接入网压降考核' },
    { label: '主光路数', value: fmtNum(m.odn['主光路数']), danger: false, delta: 'ODN 基数' },
  ];
  document.getElementById('kpis').innerHTML = items.map(it =>
    '<div class="kpi' + (it.danger ? ' danger' : '') + '">' +
      '<div class="label">' + esc(it.label) + '</div>' +
      '<div class="value">' + esc(it.value) + '</div>' +
      '<div class="delta">' + esc(it.delta) + '</div>' +
    '</div>').join('');
}

/* ---------- 营服切换 ---------- */
function renderAreaBar() {
  document.getElementById('areaBar').innerHTML = AREAS.map(a =>
    '<button class="area-btn' + (a === currentArea ? ' active' : '') + '" onclick="setArea(\'' + a + '\')">' + a + '</button>').join('');
  document.getElementById('curAreaTag').textContent = currentArea + '营服';
}
function setArea(a) { currentArea = a; renderAreaBar(); renderKpis(); renderTables(); renderAlert(); renderTop(); renderDetail(); }

/* ---------- 总表 ---------- */
function renderTables() {
  const th = DATA.thresholds;
  const areas = currentArea === '全部' ? ['大朗','寮步','大岭山','松山湖','东坑','合计'] : [currentArea];
  let h = '<div class="overflow"><table><tr><th>表1 ODN故障率</th><th>主光路数</th><th>故障光路数量</th><th>ODN故障率</th><th>重复故障率</th><th>状态</th></tr>';
  areas.forEach(a => {
    const d = getMetric(a).odn;
    if (!d || Object.keys(d).length === 0) return;
    const isDanger = (d['故障率'] > th.odn || d['重复故障率'] > th.repeat) && a !== '合计';
    h += '<tr>' +
      '<td>' + a + '</td><td>' + fmtNum(d['主光路数']) + '</td><td>' + fmtNum(d['故障光路数量']) + '</td>' +
      '<td class="' + (d['故障率'] > th.odn && a !== '合计' ? 'cell-danger' : '') + '">' + pct(d['故障率']) + '</td>' +
      '<td class="' + (d['重复故障率'] > th.repeat && a !== '合计' ? 'cell-danger' : '') + '">' + pct(d['重复故障率']) + '</td>' +
      '<td>' + (isDanger ? '<span class="chip chip-red">超标</span>' : '<span class="chip chip-ok">正常</span>') + '</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="overflow" style="margin-top:20px"><table><tr><th>接入网故障压降</th><th>故障单量</th><th>非故障单量</th><th>考核单量</th></tr>';
  areas.forEach(a => {
    const d = getMetric(a).pr;
    if (!d || Object.keys(d).length === 0) return;
    h += '<tr><td>' + a + '</td><td>' + fmtNum(d['故障单量']) + '</td><td>' + fmtNum(d['非故障单量']) + '</td><td>' + fmtNum(d['考核单量']) + '</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="overflow" style="margin-top:20px"><table><tr><th>光缆故障工单平均历时</th><th>工单数</th><th>总历时(分钟)</th><th>平均历时(h)</th><th>状态</th></tr>';
  areas.forEach(a => {
    const m = getMetric(a).du;
    if (!m || Object.keys(m).length === 0) return;
    const dur = m['平均历时_小时'];
    const isDur = dur > th.duration && a !== '合计';
    h += '<tr><td>' + a + '</td><td>' + fmtNum(m['工单数']) + '</td><td>' + fmtNum(m['总历时_分钟']) + '</td>' +
      '<td class="' + (isDur ? 'cell-danger' : '') + '">' + (dur !== undefined ? dur.toFixed(2) : '-') + '</td>' +
      '<td>' + (isDur ? '<span class="chip chip-red">超时</span>' : '<span class="chip chip-ok">正常</span>') + '</td></tr>';
  });
  h += '</table></div>';
  document.getElementById('summaryTables').innerHTML = h;
}

/* ---------- 告警横幅 ---------- */
function renderAlert() {
  const th = DATA.thresholds;
  const alerts = [];
  AREAS.filter(a => a !== '全部').forEach(a => {
    const m = getMetric(a);
    if (m.odn['故障率'] > th.odn) alerts.push(a + ' ODN故障率 ' + pct(m.odn['故障率']) + '（>0.94%）');
    if (m.odn['重复故障率'] > th.repeat) alerts.push(a + ' 重复故障率 ' + pct(m.odn['重复故障率']) + '（>0.14%）');
    if (m.du['平均历时_小时'] > th.duration) alerts.push(a + ' 平均历时 ' + m.du['平均历时_小时'].toFixed(2) + 'h（>6h）');
  });
  const el = document.getElementById('alertBanner');
  if (alerts.length) {
    document.getElementById('alertText').textContent = alerts.join('；');
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

/* ---------- 工单 Top 榜 ---------- */
function renderTop() {
  const table = DATA.tables.work;
  const rows = table.rows || [];
  if (!rows.length) { document.getElementById('topList').innerHTML = '<div class="empty">暂无数据</div>'; return; }
  // 列名匹配（兼容"故障历时(分钟)"被截断为"故障历时(分)"等情况）
  const findCol = (kw) => { const i = table.header.findIndex(c => c.includes(kw)); return i; };
  const hIdx = findCol('故障历时');
  const tIdx = findCol('故障标题');
  const nIdx = findCol('故障单号');
  const aIdx = findCol('故障地市');
  const cIdx = findCol('故障种类');
  const list = rows.map(r => ({
    title: tIdx >= 0 ? r[tIdx] : '', num: nIdx >= 0 ? r[nIdx] : '',
    dur: hIdx >= 0 ? Number(r[hIdx]) : NaN,
    area: aIdx >= 0 ? r[aIdx] : '',
  })).filter(x => !isNaN(x.dur)).sort((a,b) => b.dur - a.dur).slice(0, 10);
  if (!list.length) { document.getElementById('topList').innerHTML = '<div class="empty">暂无历时数据</div>'; return; }
  let h = '<div class="overflow"><table><tr><th>#</th><th>故障单号</th><th>营服</th><th>故障标题</th><th>历时(h)</th><th>状态</th></tr>';
  list.forEach((x,i) => {
    const hh = (x.dur/60).toFixed(2);
    const danger = x.dur/60 > DATA.thresholds.duration;
    h += '<tr><td>' + (i+1) + '</td><td>' + esc(x.num) + '</td><td>' + esc(x.area) + '</td><td>' + esc(x.title) + '</td>' +
      '<td class="' + (danger ? 'cell-danger' : '') + '">' + hh + '</td>' +
      '<td>' + (danger ? '<span class="chip chip-red">超6h</span>' : '<span class="chip chip-ok">正常</span>') + '</td></tr>';
  });
  h += '</table></div>';
  document.getElementById('topList').innerHTML = h;
}

/* ---------- 明细表 ---------- */
function renderDetail() {
  const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
  const keyMap = { 'tab-work': 'work', 'tab-pressure': 'pressure', 'tab-odn': 'odn' };
  const table = DATA.tables[keyMap[activeTab]];
  const el = document.getElementById(activeTab);
  if (!table || !table.rows || !table.rows.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const rows = table.rows.filter(r => {
    if (currentArea !== '全部' && !r.join('|').includes(currentArea)) return false;
    if (q && !r.join('|').toLowerCase().includes(q)) return false;
    return true;
  });
  if (!rows.length) { el.innerHTML = '<div class="empty">无匹配数据</div>'; return; }
  let h = '<div class="overflow"><table><tr>' + table.header.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
  rows.slice(0, 300).forEach(r => {
    h += '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>';
  });
  h += '</table></div>';
  if (rows.length > 300) h += '<div class="empty">仅显示前300条，共 ' + rows.length + ' 条</div>';
  el.innerHTML = h;
}

/* ---------- 事件绑定 ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    renderDetail();
  });
});
let searchTimer;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderDetail, 300);
});

/* ---------- 初始化 ---------- */
renderAreaBar();
renderKpis();
renderTables();
renderAlert();
renderTop();
renderDetail();
</script>
</body>
</html>
